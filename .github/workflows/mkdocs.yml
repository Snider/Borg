name: mkdocs
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5
      - uses: actions/setup-python@65d7f2d534ac1bc67fcd62888c5f4f3d2d2b2110 # v4.8.0
        with:
          python-version: '3.11'
      - run: pip install mkdocs-material
